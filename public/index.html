<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Always light: "only" tells browsers with forced dark modes (Chrome auto dark,
       Android WebView in apps like KakaoTalk) not to darken the page. -->
  <meta name="color-scheme" content="only light" />
  <title>메이플 프사 생성기</title>
  <meta name="description" content="메이플스토리 캐릭터 이름으로 카카오톡 프로필용 캐릭터 카드를 만들어요." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <h1>메이플 프사 생성기</h1>
  </header>

  <div id="inapp" class="inapp" role="alert" hidden>
    <p><b>앱 안의 브라우저에서는 이미지 저장이 안 될 수 있어요.</b>
      <span id="inappHow">기본 브라우저에서 열면 지금 만든 카드 그대로 저장할 수 있어요.</span></p>
    <button type="button" id="openExternal" class="primary">기본 브라우저로 열기</button>
  </div>

  <form id="search" class="search" autocomplete="off">
    <input id="name" name="name" type="text" maxlength="12" placeholder="캐릭터 이름" aria-label="캐릭터 이름" required />
    <button type="submit" id="searchBtn">불러오기</button>
  </form>
  <p id="status" class="status" role="status" aria-live="polite"></p>

  <main class="layout">
    <section class="preview-col">
      <div id="stage" class="stage" title="드래그로 위치 이동, 휠로 확대/축소">
        <canvas id="card" width="1080" height="1080"></canvas>
      </div>
      <p class="hint">
        <span class="hint-mouse">미리보기를 드래그하면 캐릭터 위치를, 마우스 휠(또는 아래 슬라이더)로 크기를 조절할 수 있어요.</span>
        <span class="hint-touch">미리보기를 두 손가락으로 움직이면 캐릭터 위치를, 벌리거나 오므리면(또는 아래 슬라이더로) 크기를 조절할 수 있어요.</span>
      </p>

      <div class="zoombar">
        <button type="button" id="zoomMinus" class="icon-btn" aria-label="축소">−</button>
        <input type="range" id="zoom" min="3" max="40" step="1" aria-label="확대 배율" />
        <button type="button" id="zoomPlus" class="icon-btn" aria-label="확대">+</button>
        <output id="zoomOut" for="zoom"></output>
        <button type="button" id="autoFit" class="ghost">자동 맞춤</button>
      </div>

      <div class="actions">
        <button id="download" class="primary" disabled>PNG 저장</button>
        <button id="share" hidden disabled>공유하기</button>
      </div>
    </section>

    <section class="controls">
      <fieldset>
        <legend>테마</legend>
        <div id="themes" class="swatches"></div>
      </fieldset>

      <fieldset>
        <legend>캐릭터</legend>
        <label class="row">포즈
          <select id="action">
            <option value="A00">기본 서기</option>
            <option value="A01">서기 2</option>
            <option value="A11">경계</option>
            <option value="A10">회복</option>
            <option value="A06">점프</option>
            <option value="A07">앉기</option>
            <option value="A05">비행</option>
          </select>
        </label>
        <label class="row">표정
          <select id="emotion">
            <option value="E00">기본</option>
            <option value="E02">미소</option>
            <option value="E01">윙크</option>
            <option value="E17">하트</option>
            <option value="E10">쪽</option>
            <option value="E13">반짝</option>
            <option value="E22">빛남</option>
            <option value="E09">환호</option>
            <option value="E16">흥얼</option>
            <option value="E05">당황</option>
            <option value="E04">화남</option>
            <option value="E03">울음</option>
            <option value="E20">곤란</option>
            <option value="E21">시무룩</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="noWeapon" /> 무기 숨기기</label>
        <label class="check"><input type="checkbox" id="flip" /> 좌우 반전</label>
      </fieldset>

      <fieldset>
        <legend>레이아웃</legend>
        <label class="row">사진 틀
          <select id="shape">
            <option value="squircle">둥근 사각</option>
            <option value="circle">원형</option>
          </select>
        </label>
      </fieldset>
    </section>
  </main>

  <footer class="foot">
    Data based on NEXON Open API · 이 사이트는 넥슨과 관련 없는 팬 제작 도구입니다.
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
