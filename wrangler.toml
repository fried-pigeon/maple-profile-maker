# The name must match the Worker name in the Cloudflare dashboard (Workers Builds).
name = "maple-profile-maker"
main = "src/worker.js"
compatibility_date = "2025-11-01"

# Static site. Requests that don't match a file fall through to src/worker.js (/api/*).
[assets]
directory = "./public"
binding = "ASSETS"

[observability]
enabled = true

# NEXON_API_KEY is a secret. Locally: put it in .dev.vars
# On Cloudflare: Worker > Settings > Variables and Secrets (type: Secret)
